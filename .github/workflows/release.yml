name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @superduper/desktop typecheck
      - run: pnpm --filter @superduper/desktop test
      - run: pnpm --filter @superduper/desktop pack:win
      - name: FFmpeg source
        shell: pwsh
        run: |
          $archive = 'apps/desktop/dist/FFmpeg-e38092ef93-source.tar.gz'
          Invoke-WebRequest 'https://github.com/FFmpeg/FFmpeg/archive/e38092ef93.tar.gz' -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '7578feb5284b22e6172c6f4020ddc43d746eb3ca44363756d1b47a96fd2d68f5') {
            throw "FFmpeg source archive hash mismatch: $actual"
          }
      - name: Checksums
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem apps/desktop/dist -Filter 'SDS-Sound-Setup-*.exe'
            Get-Item apps/desktop/dist/FFmpeg-e38092ef93-source.tar.gz
          )
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          if (-not $lines) { throw 'Installer was not built.' }
          [System.IO.File]::WriteAllLines('apps/desktop/dist/SHA256SUMS.txt', [string[]]$lines)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: false
          fail_on_unmatched_files: true
          name: SDS-Sound ${{ github.ref_name }}
          body: |
            Windows 10/11 x64 installer for SDS-Sound. The installer is unsigned.
            See README.md and INSTALL.md for features, setup, and limitations.
            The application source is MIT licensed. Bundled FFmpeg is GPLv3; its source is attached below. Fonts retain their own licenses.
          files: |
            apps/desktop/dist/SDS-Sound-Setup-*.exe
            apps/desktop/dist/SHA256SUMS.txt
            apps/desktop/dist/FFmpeg-e38092ef93-source.tar.gz
