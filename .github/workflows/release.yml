name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      FREESOUND_CLIENT_ID: ${{ vars.FREESOUND_CLIENT_ID }}
      FREESOUND_TOKEN_WORKER_URL: ${{ vars.FREESOUND_TOKEN_WORKER_URL }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Verify app configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FREESOUND_CLIENT_ID) -or [string]::IsNullOrWhiteSpace($env:FREESOUND_TOKEN_WORKER_URL)) {
            throw 'Set repository variables FREESOUND_CLIENT_ID and FREESOUND_TOKEN_WORKER_URL for SDS-Sound before releasing.'
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @superduper/desktop typecheck
      - run: pnpm --filter @superduper/desktop test
      - run: pnpm --filter @superduper/desktop pack:win
      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem apps/desktop/dist -Filter 'SDS-Sound-Setup-*.exe' | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          if (-not $lines) { throw 'Installer was not built.' }
          [System.IO.File]::WriteAllLines('apps/desktop/dist/SHA256SUMS.txt', [string[]]$lines)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: false
          fail_on_unmatched_files: true
          name: SDS-Sound ${{ github.ref_name }}
          body: |
            Windows 10/11 x64 installer for SDS-Sound. The installer is unsigned.
            See README.md and INSTALL.md for features, setup, and limitations.
            The application source is MIT licensed; bundled FFmpeg and fonts retain their own licenses.
          files: |
            apps/desktop/dist/SDS-Sound-Setup-*.exe
            apps/desktop/dist/SHA256SUMS.txt
